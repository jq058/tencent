            - generic [ref=e240]: "Based on the evidence: On 14 August 2026, the SGD to IDR (Indonesia) payout corridor was disrupted from 09:10 to 14:10 Singapore time. The issue was that the partner began requiring a `destination_branch_code`, and existing validation allowed an empty value to pass. The retry worker also queued 12 duplicate jobs for payouts already in the queue. The team paused the corridor, added a temporary validation check, corrected invalid payloads, cancelled the duplicate queued jobs, and replayed each approved payout once after reconciliation. No duplicate beneficiary payments were completed. All affected items were reconciled by 14:10, and the corridor resumed. As a result, two permanent fixes were implemented and approved: 1. **PAY-101**: A validator was added to reject an empty `destination_branch_code` before dispatch. Approved by Mei Tan on 18 August and closed at 10:00. 2. **PAY-102**: An idempotency guard was added to the retry worker to prevent duplicate queued jobs. Approved by Ravi Shah on 20 August and closed at 16:30. These changes were incorporated into the payout recovery runbook (RB-IDR-01) on 20 August. A third item, **PAY-103** to add corridor rejection alerts, remains in progress as of the evidence, with alert-routing verification outstanding."
