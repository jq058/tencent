            - paragraph [ref=e168]: "Incident reference: INC-2026-0814. Owner: Aisha Lim, incident commander."
            - heading "Summary" [level=2] [ref=e169]
            - paragraph [ref=e170]: On 14 August 2026, the SGD to IDR payout corridor was disrupted from 09:10 to 14:10 Singapore time. All affected items were reconciled by 14:10.
            - paragraph [ref=e171]:
              - text: A downstream payout partner changed its request contract and began requiring the field
              - code [ref=e172]: destination_branch_code
              - text: . Company A's corridor validation did not reject requests when that field was blank. The partner rejected those requests.
            - heading "Retry behavior" [level=2] [ref=e173]
            - paragraph [ref=e174]: The retry worker queued 12 additional jobs for payouts that were already in the queue. The incident team cancelled those duplicate jobs before settlement. No duplicate beneficiary payments were completed. Duplicate queue entries and duplicate settled payments are different outcomes.
            - heading "Recovery" [level=2] [ref=e175]
            - paragraph [ref=e176]: At 09:10 the team paused the affected corridor. Engineers added a temporary validation check and corrected the invalid payloads. Operations replayed each approved payout once after reconciliation checks. At 14:10 reconciliation completed and the corridor resumed.
            - heading "Follow-up work" [level=2] [ref=e177]
            - paragraph [ref=e178]: PAY-101 adds permanent validation for the partner's required field. PAY-102 adds an idempotency guard to the retry worker. PAY-103 adds alerts for unusual rejection rates in this corridor.
            - paragraph [ref=e179]: Current ticket statuses and closure times belong to the Jira records. Approval evidence belongs to the Slack sign-off thread. The current operating procedure is the payout runbook.
